<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Poker - Calculadora de Equidade</title>
  <style>
    :root {
      --bg-dark: #0b1a10;
      --felt-green: #143d22;
      --felt-card: #1c522e;
      --gold: #f39c12;
      --gold-dark: #d35400;
      --text: #ffffff;
      --text-dim: #a0aec0;
      --spade: #1a202c;
      --heart: #e53e3e;
      --diamond: #3182ce;
      --club: #2f855a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 8px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--felt-green);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 2px solid #2d6a4f;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 13px;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #333;
      color: #fff;
    }

    .status-badge.live {
      background: #e53e3e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .section-title {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .cards-row {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .card-slot {
      flex: 1;
      height: 54px;
      background: rgba(0,0,0,0.3);
      border: 1px dashed #2d6a4f;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .card-slot.active {
      border: 2px solid var(--gold);
      background: rgba(243, 156, 18, 0.15);
    }

    .card-slot.filled {
      border: 1px solid #fff;
      background: #fff;
      color: #000;
    }

    .card-slot.filled.red { color: #e53e3e; }
    .card-slot.filled.black { color: #1a202c; }

    .action-banner {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      font-weight: 900;
      font-size: 16px;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }

    .stat-box {
      background: var(--felt-card);
      padding: 6px 2px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-val { font-size: 13px; font-weight: bold; }
    .stat-lbl { font-size: 8px; color: var(--text-dim); margin-top: 2px; }

    .current-hand {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #68d391;
    }

    .keypad-suit {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 2px;
      margin-bottom: 3px;
    }

    .btn-card {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 3px;
      padding: 5px 0;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-card.spade { color: var(--spade); }
    .btn-card.heart { color: var(--heart); }
    .btn-card.diamond { color: var(--diamond); }
    .btn-card.club { color: var(--club); }
    .btn-card.used { opacity: 0.25; pointer-events: none; }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      margin-top: 8px;
    }

    .btn-pos {
      background: #2d6a4f;
      border: 1px solid #40916c;
      color: #fff;
      padding: 5px 0;
      font-size: 9px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-pos.selected {
      background: var(--gold);
      color: #000;
    }

    .inputs-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .input-group { flex: 1; }
    .input-group label { display: block; font-size: 8px; color: var(--text-dim); margin-bottom: 2px; }
    .input-group input {
      width: 100%;
      background: #0b1a10;
      border: 1px solid #2d6a4f;
      color: #fff;
      padding: 5px;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
    }

    .btn-action {
      width: 100%;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      margin-top: 6px;
      cursor: pointer;
    }

    .btn-reset {
      background: #2d6a4f;
      color: #fff;
    }

  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span>♠ Assistente Poker</span>
    <span class="status-badge">MONTE CARLO</span>
  </div>

  <div class="section-title" style="margin-top: 8px;">Mão & Mesa</div>
  <div class="cards-row">
    <div class="card-slot active" id="slot-h1" onclick="selectSlot('h1')">?</div>
    <div class="card-slot" id="slot-h2" onclick="selectSlot('h2')">?</div>
    <div style="width: 4px;"></div>
    <div class="card-slot" id="slot-b1" onclick="selectSlot('b1')">?</div>
    <div class="card-slot" id="slot-b2" onclick="selectSlot('b2')">?</div>
    <div class="card-slot" id="slot-b3" onclick="selectSlot('b3')">?</div>
    <div class="card-slot" id="slot-b4" onclick="selectSlot('b4')">?</div>
    <div class="card-slot" id="slot-b5" onclick="selectSlot('b5')">?</div>
  </div>

  <div class="action-banner" id="action-recommendation">PASSE (CHECK)</div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-val" id="equity-val">0.0%</div>
      <div class="stat-lbl">Equidade</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="win-val">0.0%</div>
      <div class="stat-lbl">Vitória</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="tie-val">0.0%</div>
      <div class="stat-lbl">Empate</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="pot-odds-val">-</div>
      <div class="stat-lbl">Pot Odds</div>
    </div>
  </div>

  <div class="current-hand" id="hand-rank">Você tem agora: Nenhuma carta</div>

  <div id="keypad"></div>

  <div class="controls-grid">
    <button class="btn-pos" onclick="setPos(this)">UTG</button>
    <button class="btn-pos" onclick="setPos(this)">MP</button>
    <button class="btn-pos" onclick="setPos(this)">CO</button>
    <button class="btn-pos selected" onclick="setPos(this)">BTN</button>
    <button class="btn-pos" onclick="setPos(this)">SB</button>
    <button class="btn-pos" onclick="setPos(this)">BB</button>
  </div>

  <div class="inputs-row">
    <div class="input-group">
      <label>Oponentes</label>
      <input type="number" id="opponents" value="3" min="1" max="8" oninput="calculate()">
    </div>
    <div class="input-group">
      <label>Pote ($)</label>
      <input type="number" id="pot-size" value="0" oninput="calculate()">
    </div>
    <div class="input-group">
      <label>Pagar ($)</label>
      <input type="number" id="call-cost" value="0" oninput="calculate()">
    </div>
  </div>

  <button class="btn-action btn-reset" onclick="resetHand()">Limpar Mão</button>
</div>

<script>
  const suits = [
    { code: 's', symbol: '♠', class: 'spade' },
    { code: 'h', symbol: '♥', class: 'heart' },
    { code: 'd', symbol: '♦', class: 'diamond' },
    { code: 'c', symbol: '♣', class: 'club' }
  ];
  const ranks = ['A', 'K', 'Q', 'J', '10', '9', '8', '7', '6', '5', '4', '3', '2'];

  let state = {
    selectedSlot: 'h1',
    cards: { h1: null, h2: null, b1: null, b2: null, b3: null, b4: null, b5: null }
  };

  function renderKeypad() {
    const keypad = document.getElementById('keypad');
    keypad.innerHTML = '';
    suits.forEach(s => {
      const row = document.createElement('div');
      row.className = 'keypad-suit';
      ranks.forEach(r => {
        const cardCode = r + s.code;
        const btn = document.createElement('button');
        btn.className = `btn-card ${s.class}`;
        btn.innerText = r + s.symbol;
        if (Object.values(state.cards).some(c => c && c.code === cardCode)) {
          btn.classList.add('used');
        }
        btn.onclick = () => assignCard(r, s);
        row.appendChild(btn);
      });
      keypad.appendChild(row);
    });
  }

  function selectSlot(slotId) {
    document.querySelectorAll('.card-slot').forEach(s => s.classList.remove('active'));
    document.getElementById(`slot-${slotId}`).classList.add('active');
    state.selectedSlot = slotId;
  }

  function assignCard(rank, suit) {
    state.cards[state.selectedSlot] = { rank, suit, code: rank + suit.code };
    updateSlotUI(state.selectedSlot);
    const slotOrder = ['h1', 'h2', 'b1', 'b2', 'b3', 'b4', 'b5'];
    const currIdx = slotOrder.indexOf(state.selectedSlot);
    if (currIdx < slotOrder.length - 1) selectSlot(slotOrder[currIdx + 1]);
    renderKeypad();
    calculate();
  }

  function updateSlotUI(slotId) {
    const slotEl = document.getElementById(`slot-${slotId}`);
    const card = state.cards[slotId];
    if (card) {
      slotEl.innerHTML = `${card.rank}<br><span style="font-size:9px">${card.suit.symbol}</span>`;
      slotEl.className = `card-slot filled ${card.suit.class === 'heart' || card.suit.class === 'diamond' ? 'red' : 'black'}`;
    } else {
      slotEl.innerHTML = '?';
      slotEl.className = 'card-slot';
    }
    if (state.selectedSlot === slotId) slotEl.classList.add('active');
  }

  function setPos(btn) {
    document.querySelectorAll('.btn-pos').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function resetHand() {
    state.cards = { h1: null, h2: null, b1: null, b2: null, b3: null, b4: null, b5: null };
    Object.keys(state.cards).forEach(s => updateSlotUI(s));
    selectSlot('h1');
    renderKeypad();
    calculate();
  }

  // ---- Avaliador de mãos (5 a 7 cartas) ----
  // Carta = (valor-2)*4 + naipe, valor 2..14
  const RANK_VAL = { A: 14, K: 13, Q: 12, J: 11, '10': 10, '9': 9, '8': 8, '7': 7, '6': 6, '5': 5, '4': 4, '3': 3, '2': 2 };
  const SUIT_IDX = { s: 0, h: 1, d: 2, c: 3 };
  const CAT_NAMES = ['Carta Alta', 'Par', 'Dois Pares', 'Trinca', 'Sequência', 'Flush', 'Full House', 'Quadra', 'Straight Flush'];
  const RANK_NAMES = { 14: 'Ases', 13: 'Reis', 12: 'Damas', 11: 'Valetes', 10: 'Dez', 9: 'Noves', 8: 'Oitos', 7: 'Setes', 6: 'Seis', 5: 'Cincos', 4: 'Quatros', 3: 'Três', 2: 'Dois' };
  const RANK_LABEL = { 14: 'A', 13: 'K', 12: 'Q', 11: 'J', 10: '10' };

  function toInt(card) { return (RANK_VAL[card.rank] - 2) * 4 + SUIT_IDX[card.suit.code]; }

  function straightHigh(mask) {
    if (mask & (1 << 14)) mask |= 1 << 1;
    for (let h = 14; h >= 5; h--) {
      if (((mask >> (h - 4)) & 0x1F) === 0x1F) return h;
    }
    return 0;
  }

  function score(cat, ks) {
    let v = cat;
    for (let i = 0; i < 5; i++) v = v * 15 + (ks[i] || 0);
    return v;
  }

  function evaluate(cs) {
    const cnt = new Array(15).fill(0), sc = [0, 0, 0, 0], sm = [0, 0, 0, 0];
    let mask = 0;
    for (const c of cs) {
      const r = (c >> 2) + 2, s = c & 3;
      cnt[r]++; sc[s]++; sm[s] |= 1 << r; mask |= 1 << r;
    }
    let flush = null;
    for (let s = 0; s < 4; s++) {
      if (sc[s] >= 5) {
        const sf = straightHigh(sm[s]);
        if (sf) return score(8, [sf]);
        flush = [];
        for (let r = 14; r >= 2 && flush.length < 5; r--) if (sm[s] & (1 << r)) flush.push(r);
      }
    }
    const quads = [], trips = [], pairs = [], singles = [];
    for (let r = 14; r >= 2; r--) {
      if (cnt[r] === 4) quads.push(r);
      else if (cnt[r] === 3) trips.push(r);
      else if (cnt[r] === 2) pairs.push(r);
      else if (cnt[r] === 1) singles.push(r);
    }
    const topExcept = (excl, n) => {
      const out = [];
      for (let r = 14; r >= 2 && out.length < n; r--) if (cnt[r] && !excl.includes(r)) out.push(r);
      return out;
    };
    if (quads.length) return score(7, [quads[0], ...topExcept([quads[0]], 1)]);
    if (trips.length && (trips.length > 1 || pairs.length)) {
      const pair = Math.max(trips[1] || 0, pairs[0] || 0);
      return score(6, [trips[0], pair]);
    }
    if (flush) return score(5, flush);
    const st = straightHigh(mask);
    if (st) return score(4, [st]);
    if (trips.length) return score(3, [trips[0], ...topExcept([trips[0]], 2)]);
    if (pairs.length >= 2) return score(2, [pairs[0], pairs[1], ...topExcept([pairs[0], pairs[1]], 1)]);
    if (pairs.length) return score(1, [pairs[0], ...topExcept([pairs[0]], 3)]);
    return score(0, singles.slice(0, 5));
  }

  function category(sc) { return Math.floor(sc / 759375); } // 15^5

  function describe(sc) {
    const cat = category(sc);
    const top = Math.floor(sc / 50625) % 15; // primeiro "kicker"
    if (cat === 8 && top === 14) return 'Royal Flush';
    if (cat === 1 || cat === 3 || cat === 7) return `${CAT_NAMES[cat]} de ${RANK_NAMES[top]}`;
    if (cat === 0) return `Carta Alta (${RANK_LABEL[top] || top})`;
    return CAT_NAMES[cat];
  }

  function describePreflop(h1, h2) {
    const r1 = RANK_VAL[h1.rank], r2 = RANK_VAL[h2.rank];
    if (r1 === r2) return `Par de ${RANK_NAMES[r1]}`;
    const [a, b] = r1 > r2 ? [r1, r2] : [r2, r1];
    const lbl = r => RANK_LABEL[r] || r;
    return `${lbl(a)}${lbl(b)} ${h1.suit.code === h2.suit.code ? 'naipadas' : 'de naipes diferentes'}`;
  }

  // ---- Simulação Monte Carlo ----
  function simulate(hero, board, opponents) {
    const used = new Set([...hero, ...board]);
    const deck = [];
    for (let c = 0; c < 52; c++) if (!used.has(c)) deck.push(c);
    const need = (5 - board.length) + opponents * 2;
    const iters = Math.min(20000, Math.floor(160000 / (opponents + 1)));
    let wins = 0, ties = 0, equity = 0;
    const fullBoard = board.slice();

    for (let it = 0; it < iters; it++) {
      for (let i = 0; i < need; i++) {
        const j = i + Math.floor(Math.random() * (deck.length - i));
        const t = deck[i]; deck[i] = deck[j]; deck[j] = t;
      }
      let k = 0;
      fullBoard.length = board.length;
      while (fullBoard.length < 5) fullBoard.push(deck[k++]);
      const heroScore = evaluate([...hero, ...fullBoard]);
      let best = 0, tiedWith = 0, lost = false;
      for (let o = 0; o < opponents; o++) {
        const s = evaluate([deck[k++], deck[k++], ...fullBoard]);
        if (s > heroScore) { lost = true; break; }
        if (s === heroScore) tiedWith++;
        if (s > best) best = s;
      }
      if (lost) continue;
      if (tiedWith === 0) { wins++; equity += 1; }
      else { ties++; equity += 1 / (tiedWith + 1); }
    }
    return { win: wins / iters * 100, tie: ties / iters * 100, equity: equity / iters * 100 };
  }

  // Cartas que melhoram a categoria da sua mão na próxima rua
  function countOuts(hero, board) {
    if (board.length < 3 || board.length > 4) return null;
    const used = new Set([...hero, ...board]);
    const cur = category(evaluate([...hero, ...board]));
    let outs = 0;
    for (let c = 0; c < 52; c++) {
      if (used.has(c)) continue;
      const nb = [...board, c];
      const cat = category(evaluate([...hero, ...nb]));
      // conta só se melhora a sua mão e não apenas a mesa
      if (cat > cur && cat > category(evaluate(nb))) outs++;
    }
    return outs;
  }

  let calcTimer = null;
  function calculate() {
    clearTimeout(calcTimer);
    calcTimer = setTimeout(runCalculation, 30);
  }

  function setBanner(text, bg, color) {
    const el = document.getElementById('action-recommendation');
    el.innerText = text;
    el.style.background = bg;
    el.style.color = color;
  }

  function runCalculation() {
    const potOddsEl = document.getElementById('pot-odds-val');
    if (!state.cards.h1 || !state.cards.h2) {
      document.getElementById('equity-val').innerText = '0.0%';
      document.getElementById('win-val').innerText = '0.0%';
      document.getElementById('tie-val').innerText = '0.0%';
      potOddsEl.innerText = '-';
      document.getElementById('hand-rank').innerText = 'Aguardando suas 2 cartas...';
      setBanner('ESCOLHA SUAS CARTAS', 'linear-gradient(135deg, #f39c12, #d35400)', '#000');
      return;
    }

    const hero = [toInt(state.cards.h1), toInt(state.cards.h2)];
    const board = ['b1', 'b2', 'b3', 'b4', 'b5'].filter(k => state.cards[k]).map(k => toInt(state.cards[k]));
    if (board.length === 1 || board.length === 2) {
      document.getElementById('hand-rank').innerText = 'Complete o flop (3 cartas) para calcular';
      return;
    }

    const opponents = Math.min(Math.max(parseInt(document.getElementById('opponents').value) || 1, 1), 8);
    const res = simulate(hero, board, opponents);

    document.getElementById('equity-val').innerText = res.equity.toFixed(1) + '%';
    document.getElementById('win-val').innerText = res.win.toFixed(1) + '%';
    document.getElementById('tie-val').innerText = res.tie.toFixed(1) + '%';

    let handText = board.length >= 3 ? describe(evaluate([...hero, ...board])) : describePreflop(state.cards.h1, state.cards.h2);
    const outs = countOuts(hero, board);
    if (outs !== null) handText += ` · ${outs} outs`;
    document.getElementById('hand-rank').innerText = 'Você tem agora: ' + handText;

    // Equidade "forte": bem acima da sua parte justa do pote contra N oponentes
    const fair = 100 / (opponents + 1);
    const strong = res.equity >= fair + (100 - fair) * 0.25;

    const pot = parseFloat(document.getElementById('pot-size').value) || 0;
    const call = parseFloat(document.getElementById('call-cost').value) || 0;

    if (call > 0) {
      const potOdds = call / (pot + call) * 100;
      potOddsEl.innerText = potOdds.toFixed(1) + '%';
      if (res.equity > potOdds) {
        if (strong) setBanner('AUMENTAR (RAISE)', 'linear-gradient(135deg, #2b6cb0, #2c5282)', '#fff');
        else setBanner('PAGAR (CALL)', 'linear-gradient(135deg, #2f855a, #276749)', '#fff');
      } else {
        setBanner('DESISTIR (FOLD)', 'linear-gradient(135deg, #e53e3e, #c53030)', '#fff');
      }
    } else {
      potOddsEl.innerText = '-';
      if (strong) setBanner('APOSTAR (BET)', 'linear-gradient(135deg, #2b6cb0, #2c5282)', '#fff');
      else setBanner('PASSE (CHECK)', 'linear-gradient(135deg, #f39c12, #d35400)', '#000');
    }
  }

  renderKeypad();
  calculate();
</script>
</body>
</html>
