plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cuidadorcaotico.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.cuidadorcaotico.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave debug para poder instalar direto no celular para testes.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
