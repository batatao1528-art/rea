<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2c5a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Vale Florido</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="pill" id="energyPill"><span>❤️</span><div class="bar"><div id="energyFill"></div></div><span id="energyTxt" class="small"></span></div>
      <div class="pill"><span>💰</span><span id="goldTxt">0</span></div>
      <div class="pill" id="lvlPill"><span>⭐</span><span id="lvlTxt">Nv 1</span><div class="bar xp"><div id="xpFill"></div></div></div>
    </div>
    <div class="hud-right">
      <div class="pill" id="datePill"><span id="weatherIco">☀️</span><span id="dateTxt"></span><b id="timeTxt"></b></div>
      <button class="round" id="menuBtn" aria-label="Menu">⚙️</button>
    </div>
  </div>

  <div id="joy"><div id="joyKnob"></div></div>
  <button id="actionBtn" class="hidden" aria-label="Ação"><span id="actionIco"></span><small id="actionLbl"></small></button>
  <div id="hotbar" class="hidden"></div>
  <div id="toast"></div>

  <div id="title">
    <div class="title-card">
      <div class="logo">🌻 Vale Florido</div>
      <div class="subtitle">uma fazendinha em pixel art</div>
      <div id="titleBtns"></div>
      <div class="credit">Plante · Regue · Colha · Venda · Pesque · Minere</div>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div class="panel">
      <div class="panel-head"><h2 id="modalTitle"></h2><button id="modalClose" aria-label="Fechar">✕</button></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="fade"></div>

  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
